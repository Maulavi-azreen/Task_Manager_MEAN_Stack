<div class="auth-container">
  <mat-card class="auth-card">
    <h2 class="form-title">Welcome Back</h2>
    <p class="subtitle">Login to manage your tasks efficiently.</p>

    <form (submit)="onLogin()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" [(ngModel)]="loginData.email" name="email" required>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" [(ngModel)]="loginData.password" name="password" required>
      </mat-form-field>

      <button mat-raised-button color="primary" class="full-width login-btn">
        Login
      </button>

      <p class="switch-auth">Don't have an account? 
        <a routerLink="/signup">Sign Up</a>
      </p>
    </form>
  </mat-card>
</div>
