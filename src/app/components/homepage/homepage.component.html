<div class="hero">
    <img [src]="imageSrc" alt="Productivity" class="hero-img">
    <div class="hero-content">
      <h1>Boost Your Productivity</h1>
      <p>Organize your tasks efficiently with Task Manager.</p>
      <div class="buttons">
        <button mat-raised-button color="primary" routerLink="/login">Get Started</button>
        <button mat-raised-button color="accent" routerLink="/signup">Sign Up</button>
      </div>
    </div>
  </div>
  
  <div class="features">
    <div class="feature">
      <mat-icon class="icon">task</mat-icon>
      <h3>Manage Tasks</h3>
      <p>Create, track, and complete your tasks seamlessly.</p>
    </div>
    <div class="feature">
      <mat-icon class="icon">notifications</mat-icon>
      <h3>Get Reminders</h3>
      <p>Never miss a deadline with timely notifications.</p>
    </div>
    <div class="feature">
      <mat-icon class="icon">group</mat-icon>
      <h3>Collaborate</h3>
      <p>Work with your team and boost productivity.</p>
    </div>
  </div>
